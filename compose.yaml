name: stream-radio
x-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: '2'
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    pids_limit: 128
    ulimits:
      nofile:
        soft: 2048
        hard: 2048
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      DATA_DIR: /data
      ICECAST_URL: http://icecast:8000
      LIQUIDSOAP_HOST: liquidsoap
    ports:
      - '127.0.0.1:4173:4173'
    volumes:
      - radio-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
  icecast:
    image: stream-radio-engine:local
    build:
      context: .
      dockerfile: docker/radio.Dockerfile
    restart: unless-stopped
    init: true
    security_opt: ['no-new-privileges:true']
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 64
    environment:
      ICECAST_PASSWORD: ${ICECAST_PASSWORD:?Run npm run setup first}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?Run npm run setup first}
    command: ['/usr/local/bin/start-icecast']
    logging: *logging
  liquidsoap:
    image: stream-radio-engine:local
    build:
      context: .
      dockerfile: docker/radio.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 256
    environment:
      ICECAST_PASSWORD: ${ICECAST_PASSWORD:?Run npm run setup first}
    user: liquidsoap
    command: ['liquidsoap', '/etc/radio.liq']
    volumes:
      - radio-data:/data:ro
    depends_on:
      app:
        condition: service_healthy
      icecast:
        condition: service_started
    logging: *logging
volumes:
  radio-data:
